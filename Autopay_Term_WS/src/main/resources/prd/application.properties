logging.level.root=INFO
logging.level.com.hkhs.hmms=INFO
logging.file.name=logs/autopay-termination.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14

spring.config.import=classpath:upload.properties
spring.profiles.active=prd
ihousing.db.scope=prd
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.url=${ihousing.db.url}
spring.datasource.username=${ihousing.db.username}
spring.datasource.password=${ihousing.db.password}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

cxf.path=/services
server.servlet.context-path=/Autopay_Term_WS
server.port=8080
autopay.file-charset=UTF-8
autopay.cors-origins=http://localhost:3000
